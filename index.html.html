<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAND LAB — GHOST MODE</title>
<style>
  :root { --bg:#05070a; --fg:#c9d4e0; --accent:#ff6a4d; --gold:#e8c14a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: "Courier New", monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; max-width:960px; display:flex; justify-content:space-between; padding:12px 16px; font-size:12px; letter-spacing:2px; color:#7f8c9a; }
  #status.active { color:var(--accent); }
  #stage { position:relative; width:100%; max-width:960px; aspect-ratio:4/3; background:#000; border:1px solid #1b2530; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1); } /* mirror */
  #hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font-size:11px; letter-spacing:2px; color:#9fb0c0; text-shadow:0 0 6px #000; text-align:center; width:90%; pointer-events:none; }
  #countdown { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:120px; color:var(--gold); text-shadow:0 0 20px #000; pointer-events:none; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; background:rgba(0,0,0,.8); text-align:center; padding:20px; }
  button { background:transparent; color:var(--fg); border:1px solid #3a4a5a; padding:10px 18px; font-family:inherit; letter-spacing:2px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:14px; align-items:center; font-size:12px; }
  label { display:flex; align-items:center; gap:6px; }
  #err { color:#ff7b7b; font-size:12px; max-width:600px; }
</style>
</head>
<body>
<header>
  <span>HAND LAB / GHOST · INVISIBILITY MODE</span>
  <span id="status">GHOST IDLE</span>
</header>

<div id="stage">
  <canvas id="out"></canvas>
  <div id="countdown"></div>
  <div id="hint">1) Ambil background bersih tanpa orang/bayangan → 2) CUBIT jari untuk menghilang total → CUBIT lagi untuk muncul</div>
  <div id="overlay">
    <h2>GHOST MODE</h2>
    <p>Background plate bersih + deteksi pinch.<br>Ghost mode menutup seluruh frame dengan background agar bayangan ikut hilang.</p>
    <button id="startBtn">MULAI KAMERA</button>
    <div id="err"></div>
  </div>
</div>

<div class="controls">
  <button id="plateBtn" disabled>AMBIL BACKGROUND (5 dtk)</button>
  <button id="toggleBtn" disabled>TOGGLE GHOST (G)</button>
  <label>Ambang pinch <input id="pinchTh" type="range" min="0.1" max="0.5" step="0.01" value="0.28"></label>
  <label>Haluskan tepi <input id="feather" type="range" min="0" max="12" step="1" value="4"></label>
  <label><input id="invert" type="checkbox"> Balik mask</label>
  <label><input id="skeleton" type="checkbox" checked> Tampilkan tangan</label>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker, ImageSegmenter }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const W = 640, H = 480;
const $ = id => document.getElementById(id);
const out = $("out"), ctx = out.getContext("2d");
out.width = W; out.height = H;

const video = document.createElement("video");
video.playsInline = true; video.muted = true;

// canvas bantu
const plate = document.createElement("canvas");  plate.width = W; plate.height = H;
const plateCtx = plate.getContext("2d");
const tmp = document.createElement("canvas");    tmp.width = W; tmp.height = H;
const tmpCtx = tmp.getContext("2d");
const maskC = document.createElement("canvas");  maskC.width = W; maskC.height = H;
const maskCtx = maskC.getContext("2d");
let maskImg = maskCtx.createImageData(W, H);

let handLandmarker, segmenter;
let hasPlate = false;
let ghostOn = false;
let ghostAmount = 0;           // 0..1 untuk transisi halus
let pinchHeld = false;
let lastToggle = 0;
let lastTs = -1;

const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

async function init() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");

  handLandmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO", numHands: 2
  });

  segmenter = await ImageSegmenter.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    outputConfidenceMasks: true,
    outputCategoryMask: false
  });
}

$("startBtn").onclick = async () => {
  const btn = $("startBtn"); btn.disabled = true; btn.textContent = "MEMUAT MODEL...";
  try {
    await init();
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: W, height: H, facingMode: "user" }, audio: false });
    video.srcObject = stream;
    await video.play();
    $("overlay").style.display = "none";
    $("plateBtn").disabled = false;
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = "COBA LAGI";
    $("err").textContent = "Gagal: " + e.message +
      " — jika dibuka via file://, jalankan server lokal (python -m http.server) lalu buka http://localhost:8000";
  }
};

// ---- ambil background plate ----
function capturePlate() {
  $("plateBtn").disabled = true;
  const cd = $("countdown"); cd.style.display = "flex";
  let n = 5; cd.textContent = n;
  const t = setInterval(() => {
    n--;
    if (n > 0) { cd.textContent = n; return; }
    clearInterval(t);
    plateCtx.drawImage(video, 0, 0, W, H);
    hasPlate = true;
    cd.style.display = "none";
    $("plateBtn").disabled = false;
    $("plateBtn").textContent = "AMBIL ULANG BACKGROUND";
    $("toggleBtn").disabled = false;
    $("hint").textContent = "Background tersimpan. Pastikan background bersih tanpa orang/bayangan, lalu CUBIT untuk menghilang total";
  }, 1000);
}
$("plateBtn").onclick = capturePlate;

function toggleGhost() {
  if (!hasPlate) { $("hint").textContent = "Ambil background dulu!"; return; }
  ghostOn = !ghostOn;
  const s = $("status");
  s.textContent = ghostOn ? "GHOST ACTIVE" : "GHOST IDLE";
  s.classList.toggle("active", ghostOn);
  $("hint").textContent = ghostOn ? "PINCH AGAIN → REAPPEAR" : "PINCH → DISAPPEAR";
}
$("toggleBtn").onclick = toggleGhost;
addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "g") toggleGhost();
  if (e.key.toLowerCase() === "b") capturePlate();
});

// ---- deteksi pinch ----
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function detectPinch(hands) {
  const th = parseFloat($("pinchTh").value);
  for (const lm of hands) {
    const handSize = dist(lm[0], lm[9]) || 1;     // pergelangan -> pangkal jari tengah
    const ratio = dist(lm[4], lm[8]) / handSize;  // jempol <-> telunjuk
    if (ratio < th) return true;
  }
  return false;
}

function drawHands(hands) {
  if (!$("skeleton").checked) return;
  ctx.lineWidth = 2;
  for (const lm of hands) {
    ctx.strokeStyle = "rgba(255,106,77,.9)";
    ctx.beginPath();
    for (const [a, b] of CONNECTIONS) {
      ctx.moveTo(lm[a].x * W, lm[a].y * H);
      ctx.lineTo(lm[b].x * W, lm[b].y * H);
    }
    ctx.stroke();
    ctx.fillStyle = "#ff3b2f";
    for (const p of lm) { ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 3, 0, 7); ctx.fill(); }
    // kotak pinch
    const p4 = lm[4], p8 = lm[8];
    ctx.strokeStyle = "rgba(232,193,74,.9)";
    ctx.strokeRect(Math.min(p4.x, p8.x) * W - 20, Math.min(p4.y, p8.y) * H - 20,
      Math.abs(p4.x - p8.x) * W + 40, Math.abs(p4.y - p8.y) * H + 40);
  }
}

// ---- loop utama ----
function loop() {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;

  const ts = performance.now();
  if (ts <= lastTs) return;
  lastTs = ts;

  // 1) gambar frame kamera
  ctx.globalAlpha = 1;
  ctx.drawImage(video, 0, 0, W, H);

  // 2) tangan + pinch
  const handRes = handLandmarker.detectForVideo(video, ts);
  const hands = handRes.landmarks || [];
  const pinching = detectPinch(hands);
  if (pinching && !pinchHeld && ts - lastToggle > 900) {
    toggleGhost();
    lastToggle = ts;
  }
  pinchHeld = pinching;

  // 3) transisi ghost
  ghostAmount += ((ghostOn ? 1 : 0) - ghostAmount) * 0.18;
  if (Math.abs(ghostAmount - (ghostOn ? 1 : 0)) < 0.01) ghostAmount = ghostOn ? 1 : 0;

  // 4) GHOST MODE: tampilkan background bersih secara penuh.
  // Ini juga menghilangkan bayangan, karena bayangan sering tidak terdeteksi
  // sebagai bagian tubuh oleh model segmentasi.
  if (hasPlate && ghostAmount > 0.01) {
    ctx.globalAlpha = ghostAmount;
    ctx.drawImage(plate, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // 5) overlay tangan
  drawHands(hands);
}
</script>
</body>
</html>
